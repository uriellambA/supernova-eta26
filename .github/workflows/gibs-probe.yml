name: gibs-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          curl -s -o caps.xml https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/1.0.0/WMTSCapabilities.xml
          python3 - <<'PY'
          import re
          x=open('caps.xml').read()
          for m in re.finditer(r'<Layer>(.*?)</Layer>', x, re.S):
              b=m.group(1); i=re.search(r'<ows:Identifier>(.*?)</ows:Identifier>', b).group(1)
              if i in ('MODIS_Terra_NDVI_8Day','MODIS_Terra_Land_Surface_Temp_Day','MODIS_Terra_NDSI_Snow_Cover','MODIS_Terra_L3_NDVI_16Day','MODIS_Terra_EVI_8Day'):
                  print(i, re.findall(r'href="([^"]+)"', b), re.findall(r'<Value>(.*?)</Value>', b)[:4])
          PY
      - run: timeout 300 npx tsx scripts/probe-ndvi.mts
