name: soil-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: curl -s -m 60 -o t.tif -w "%{http_code} %{content_type} %{size_download} %{time_total}\n" "https://maps.isric.org/mapserv?map=/map/clay.map&SERVICE=WCS&VERSION=2.0.1&REQUEST=GetCoverage&COVERAGEID=clay_0-5cm_mean&FORMAT=image/tiff&SUBSETTINGCRS=http://www.opengis.net/def/crs/EPSG/0/4326&OUTPUTCRS=http://www.opengis.net/def/crs/EPSG/0/4326&SUBSET=long(-71.618,-71.612)&SUBSET=lat(-46.553,-46.547)"; head -c 600 t.tif | strings | head -5
      - run: timeout 400 npx tsx scripts/probe-soil.mts
