<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Growvia</title>
  <style>
    :root { --bg: #1e120e; --surface: #2a1913; --line: #4a2d23; --ink: #f6ece2; --muted: #c7a896; --cta: #c4552f; --cta-ink: #fff8f0; --gold: #d9a441; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: radial-gradient(circle at 50% 35%, #3a2218 0%, var(--bg) 62%); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    main { width: min(420px, 90vw); text-align: center; }
    .avatar { position: relative; width: 190px; height: 214px; margin: 0 auto; }
    .avatar::before { content: ""; position: absolute; inset: 10% 5% 0; border-radius: 50%; background: radial-gradient(circle, rgba(217,164,65,.45), transparent 65%); animation: glow 2.6s ease-in-out infinite; }
    .avatar img { position: relative; width: 100%; height: 100%; object-fit: contain; animation: breathe 4.5s ease-in-out infinite; transform-origin: 50% 100%; -webkit-mask-image: linear-gradient(to bottom, #000 82%, transparent); mask-image: linear-gradient(to bottom, #000 82%, transparent); }
    h1 { margin: 18px 0 2px; font: 400 44px/1 Georgia, "Times New Roman", serif; letter-spacing: -.01em; }
    .sub { color: var(--muted); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }
    .status { margin-top: 26px; min-height: 48px; }
    .dots { display: inline-flex; gap: 6px; margin-top: 10px; }
    .dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); animation: bounce 1.2s infinite ease-in-out; }
    .dots span:nth-child(2) { animation-delay: .15s; } .dots span:nth-child(3) { animation-delay: .3s; }
    .card { margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); text-align: left; }
    .card h2 { margin: 0 0 4px; font-size: 17px; }
    .card p { margin: 0; color: var(--muted); font-size: 14px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    button { cursor: pointer; border-radius: 12px; padding: 10px 16px; font: 600 14px system-ui, sans-serif; border: 1px solid var(--line); background: transparent; color: var(--ink); }
    button.primary { background: var(--cta); border-color: var(--cta); color: var(--cta-ink); }
    button:hover { filter: brightness(1.1); }
    .hidden { display: none; }
    .ver { position: fixed; bottom: 10px; left: 0; right: 0; text-align: center; color: #9c7c6b; font-size: 11px; }
    @keyframes breathe { 50% { transform: scale(1.012) translateY(-2px); } }
    @keyframes glow { 50% { opacity: .55; transform: scale(1.06); } }
    @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .5; } 40% { transform: translateY(-6px); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</head>
<body>
  <main>
    <div class="avatar"><img src="pachamama.webp" alt="" /></div>
    <h1>Growvia</h1>
    <div class="sub" data-t="sub">Growwy · tu guía en la chacra</div>

    <div id="loading" class="status">
      <div data-t="loading">Conectando con Growwy…</div>
      <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>

    <div id="offline" class="card hidden" role="alert">
      <h2 data-t="offTitle">Sin conexión a internet</h2>
      <p data-t="offText">Growwy necesita internet para leer el clima y los satélites. Si ya usaste Growvia en esta computadora, podés abrir lo que quedó guardado.</p>
      <div class="row">
        <button class="primary" id="retry" data-t="retry">Reintentar</button>
        <button id="saved" data-t="saved">Abrir lo guardado</button>
      </div>
    </div>
  </main>
  <div class="ver" id="ver"></div>

  <script>
    const T = {
      es: {},
      en: { sub: "Growwy · your farm guide", loading: "Connecting with Growwy…", offTitle: "No internet connection", offText: "Growwy needs internet to read the climate and the satellites. If you already used Growvia on this computer, you can open what was saved.", retry: "Try again", saved: "Open saved pages" },
    };
    const lang = localStorage.getItem("growvia-lang") === "en" ? "en" : "es"; // Spanish first, like the web
    for (const el of document.querySelectorAll("[data-t]")) if (T[lang][el.dataset.t]) el.textContent = T[lang][el.dataset.t];

    const invoke = window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke;
    const info = window.__GROWVIA_DESKTOP__;
    // "Growvia Desktop" only on computers; on phones it is just "Growvia"
    const mobile = info && (info.platform === "android" || info.platform === "ios");
    if (info) document.getElementById("ver").textContent = (mobile ? "Growvia " : "Growvia Desktop ") + info.version;
    let base = "https://growvia-coral.vercel.app";

    function show(id) {
      document.getElementById("loading").classList.toggle("hidden", id !== "loading");
      document.getElementById("offline").classList.toggle("hidden", id !== "offline");
    }
    let startPath = "/app";
    function open() { location.replace(base + startPath); }

    async function start() {
      show("loading");
      if (invoke) { try { base = await invoke("app_url_cmd"); startPath = await invoke("start_path"); } catch (e) {} }
      if (navigator.onLine === false) return show("offline");
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 9000);
      try {
        await fetch(base + "/manifest.webmanifest", { mode: "no-cors", cache: "no-store", signal: ctrl.signal });
        open();
      } catch (e) {
        show("offline");
      } finally {
        clearTimeout(timer);
      }
    }
    document.getElementById("retry").onclick = start;
    document.getElementById("saved").onclick = open;
    window.addEventListener("online", start);
    start();
  </script>
</body>
</html>
